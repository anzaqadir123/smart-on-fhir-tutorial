<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <link rel='stylesheet' type='text/css' href='./src/css/example-smart-app.css'>
    <title>Example-SMART-App (Backend Proxy)</title>
  </head>
  <body>
    <!-- FHIR Client JS Library -->
    <script src='./lib/js/fhir-client-v0.1.12.js'></script>

    <!-- Prevent session bleed caused by single threaded embedded browser and sessionStorage API -->
    <script src='./lib/js/fhir-client-cerner-additions-1.0.0.js'></script>
    <script>
      // Debug: Log the scope being requested
      var requestedScopes = 'launch patient/Patient.read patient/Observation.read online_access openid profile';
      console.log('🔍 REQUESTING SCOPES:', requestedScopes);
      console.log('🔄 Using backend proxy to avoid CORS issues');
      
      FHIR.oauth2.authorize({
        'client_id': 'f3bd5c67-dd03-488e-b3d9-c3cc97bb9b8e',
        'scope': requestedScopes
      });
    </script>
    <div class="spinner">
      <div class="bounce1"></div>
      <div class="bounce2"></div>
      <div class="bounce3"></div>
    </div>
  </body>
</html>
